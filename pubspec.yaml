name: frezka
description: A new Flutter project.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # COMMON
  nb_utils: ^7.1.8
  google_fonts: ^6.3.3
  html: ^0.15.6
  http: ^1.6.0
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  url_launcher: ^6.3.2
  flutter_custom_tabs: ^2.4.1
  flutter_html: ^3.0.0-beta.2
  share_plus: ^12.0.1
  speech_to_text: ^7.3.0
  webview_flutter: ^4.13.0
  open_file: ^3.5.10
  permission_handler: ^12.0.1
  playx_version_update: ^1.0.1
  # State Management
  mobx: ^2.5.0
  flutter_mobx: ^2.3.0


  # FIREBASE
  firebase_crashlytics: ^5.0.6
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1

  #Firebase Notification
  flutter_local_notifications: ^19.5.0
  firebase_messaging: ^16.1.0

  # COUNTRY PICKER
  country_picker: ^2.0.27

  # SOCIAL LOGIN
  google_sign_in: ^7.2.0
  the_apple_sign_in: ^1.1.1

  # Image
  image_picker: ^1.2.1
  photo_view: ^0.15.0
  lottie: ^3.3.2

  #MAP
  geolocator: ^14.0.2

  # PAYMENT GATEWAYS
  razorpay_flutter: ^1.4.0
  flutter_stripe: ^12.1.1
  flutter_paypal_checkout:
    git:
      url: https://github.com/iqonic-design/flutter_paypal_checkout.git
      ref: main
  flutterwave_standard:
    git:
      url: https://github.com/iqonic-design/flutterwave_standard.git
      ref: main
  cinetpay:
    git:
      url: https://github.com/iqonic-design/cinetpay.git
      ref: main
  midpay:
    git:
      url: https://github.com/iqonic-design/midpay.git
      ref: main
  phonepe_payment_sdk: ^3.0.2
  flutter_paystack:
    git:
      url: https://github.com/iqonic-design/flutter_paystack.git
      ref: 1.5.0

  uuid: ^4.5.2
  crypto: ^3.0.7
  path_provider: ^2.1.5

  flutter_localizations:
    sdk: flutter
  shadcn_ui: ^0.43.0
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.10.4
  mobx_codegen: ^2.7.4
  #dart run build_runner build --delete-conflicting-outputs --enable-experiment=records
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF" # Your brand background color
  adaptive_icon_foreground: "assets/app_logo.png" # Transparent logo with 20% padding

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/flags/
    - assets/images/
    - assets/icons/
    - assets/lottie/